# Publish the game to GitHub Pages on every push to main.
# The played game is always the newest commit — no downloads, no stale copies.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Ship only the game, not the tests/tools that measure it.
      # Pages serves everything with a 10-minute browser cache; stamping the
      # commit onto each css/js URL makes a fresh index.html pull matching
      # fresh files — a refresh can lag a few minutes behind a push, but it
      # can never mix files from two different versions of the game.
      - name: Stage site
        run: |
          mkdir _site
          cp -r index.html css js assets _site/
          V="${GITHUB_SHA::7}"
          sed -i "s|href=\"css/risen.css\"|href=\"css/risen.css?v=$V\"|; s|src=\"js/\([a-z]*\)\.js\"|src=\"js/\1.js?v=$V\"|g" _site/index.html
          grep -c "?v=$V" _site/index.html
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
