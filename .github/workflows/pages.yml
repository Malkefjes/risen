# Publish the game to GitHub Pages on every push to main.
# The played game is always the newest commit — no downloads, no stale copies.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Ship only the game, not the tests/tools that measure it.
      # Pages serves everything with a 10-minute browser cache; stamping the
      # commit onto each css/js URL makes a fresh index.html pull matching
      # fresh files — a refresh can lag a few minutes behind a push, but it
      # can never mix files from two different versions of the game.
      - name: Stage site
        run: |
          mkdir _site
          cp -r index.html css js assets _site/
          V="${GITHUB_SHA::7}"
          sed -i "s|src=\"js/\([a-z]*\)\.js\"|src=\"js/\1.js?v=$V\"|g" _site/index.html
          # Inline the stylesheet into the deployed page. The css fetch was the
          # one render-critical request left, and when it failed or stalled the
          # whole UI painted as an unstyled grey page (sprites, being images,
          # kept their color — the tell). Inlined, the failure mode does not
          # exist. Font urls are ../assets relative to css/; from the page they
          # must be plain assets/.
          python3 - <<'PYEOF'
          html = open('_site/index.html').read()
          css = open('_site/css/risen.css').read().replace('../assets/', 'assets/')
          tag = '<link rel="stylesheet" href="css/risen.css">'
          assert tag in html
          html = html.replace(tag, '<style>\n' + css + '\n</style>')
          open('_site/index.html', 'w').write(html)
          PYEOF
          grep -c "?v=$V" _site/index.html && grep -c "<style>" _site/index.html
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
